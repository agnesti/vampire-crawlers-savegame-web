<!DOCTYPE html>
<html lang="es">

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>

  html { -webkit-text-size-adjust: 100%; }

  .top-in { max-width: 1008px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand h1 { font: 700 1.2rem var(--pix); margin: 0; line-height: 1.1; }
  .brand small { color: var(--muted); font-size: .85rem; }

  .btn {
    font-family: var(--pix); font-weight: 700; font-size: .95rem;
    background: var(--gold); color: #2a1d05;
    border: 0; padding: 0 16px; min-height: var(--tap);

  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .btn:active:not(:disabled) { top: 2px; box-shadow: 0 1px 0 0 var(--gold-dark); }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: 0 0 0 2px var(--line); }
  .btn.ghost:active:not(:disabled) { top: 0; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: .88rem; }
  .btn:disabled { background: var(--panel-hi); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .tab:focus-visible, .chip:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  main { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); min-width: 0; }

  .empty { text-align: center; padding: 48px 20px; margin-top: 8px; }
  .empty p { margin: 14px 0 6px; color: var(--muted); }
  .empty .path { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; color: var(--muted); margin-top: 16px; overflow-wrap: anywhere; }

  .fileline { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 12px; }
  .fileline b { font-family: var(--pix); font-size: 1.05rem; overflow-wrap: anywhere; }
  .fileline span { color: var(--muted); font-size: .88rem; }

  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line-soft); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }

    padding: 0 14px; min-height: var(--tap);

  }
  .tab[aria-selected=true] { color: var(--gold); border-bottom-color: var(--gold); }

  .notice { border-left: 4px solid var(--gold); background: var(--panel-hi); padding: 10px 14px; margin-bottom: 18px; font-size: .92rem; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .sec { padding: 16px 18px 18px; min-width: 0; }
  .sec h2 { font: 700 1.05rem var(--pix); margin: 0 0 12px; color: var(--gold); }
  .sec h2 small { font: 500 .8rem var(--body); color: var(--muted); margin-left: 6px; }

  .coinrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .coinrow img, .coinrow .coinfb { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
  .coinfb { border-radius: 50%; background: var(--gold); }
  .coinnum {
    font: 700 1.9rem var(--pix); color: var(--gold);
    width: 11ch; max-width: 100%; min-width: 0;
    background: var(--bg); border: 0; box-shadow: 0 0 0 2px var(--line);
    padding: 4px 10px;
  }
  .coinnote { color: var(--muted); font-size: .86rem; margin: 10px 0 0; }
  .coinnote.warn { color: var(--gold); }

  .party { display: flex; flex-wrap: wrap; gap: 12px; }
  .who { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px; text-align: center; font-size: .8rem; }
  .who img, .who .fb { width: 48px; height: 48px; image-rendering: pixelated; }
  .who .fb, .tile .fb { display: grid; place-items: center; background: var(--panel-hi); font: 700 1.2rem var(--pix); color: var(--muted); }
  .who.lead span { color: var(--gold); }
  .sub { color: var(--muted); font-size: .85rem; margin: 14px 0 8px; }

  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }

  .tile[aria-pressed=true] { box-shadow: 0 0 0 2px var(--gold); background: var(--panel-hi); }

  .rows { display: flex; flex-direction: column; }
  .row {

  .row:last-child { border-bottom: 0; }
  .row label, .row .lbl { flex: 1; cursor: pointer; overflow-wrap: anywhere; min-width: 0; }
  .row .val { font-family: var(--pix); font-weight: 700; text-align: right; }
  .row .ctrl { display: flex; align-items: center; gap: 10px; }

  input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; margin: 0; cursor: pointer; flex: none;
    background: var(--bg); box-shadow: 0 0 0 2px var(--line); position: relative;

  input[type=checkbox]:checked { background: var(--gold); box-shadow: 0 0 0 2px var(--gold-dark); }
  input[type=checkbox]:checked::after {
    content: ""; position: absolute; left: 7px; top: 3px; width: 5px; height: 10px;
    border: solid #2a1d05; border-width: 0 3px 3px 0; transform: rotate(40deg);
  }
  .lvl {
    width: 4.4ch; text-align: center; font-family: var(--pix); font-weight: 700;
    background: var(--bg); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 4px;
  }
  select {
    background: var(--bg); border: 0; box-shadow: 0 0 0 2px var(--line);
    padding: 8px 10px; min-height: 40px; max-width: 100%; width: 100%;
  }
  .pu { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; }

  .dtable { margin-top: 10px; }
  .drow { display: grid; grid-template-columns: minmax(0, 1fr) 76px 96px; align-items: center; gap: 8px; padding: 4px 0; min-height: 40px; border-bottom: 1px solid var(--line-soft); }
  .drow:last-child { border-bottom: 0; }
  .drow.head { color: var(--muted); font-size: .78rem; min-height: 28px; }
  .drow input[type=checkbox] { justify-self: center; }
  .drow .dn { overflow-wrap: anywhere; }

  .jsonbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .search { flex: 1 1 200px; min-width: 0; background: var(--bg); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 0 12px; min-height: var(--tap); }
  .count { color: var(--muted); font-size: .88rem; flex: 1 1 100%; order: 3; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: .85rem; }
  .chip { background: var(--panel-hi); border: 0; cursor: pointer; padding: 6px 12px; font-size: .85rem; box-shadow: 0 0 0 1px var(--line); }
  .chip:hover { box-shadow: 0 0 0 1px var(--gold); }
  .editwrap { position: relative; background: var(--bg); box-shadow: 0 0 0 2px var(--line); }
  textarea.json, .backdrop, .ruler {
    font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    font-size: 13px; line-height: 20px; letter-spacing: normal; word-spacing: normal;
    white-space: pre; tab-size: 2; padding: 12px; margin: 0; border: 0;
  }
  textarea.json {
    display: block; position: relative; z-index: 1; width: 100%;
    height: 62vh; height: 62dvh; min-height: 300px;
    resize: vertical; overflow: auto; background: transparent; color: var(--text);
  }
  textarea.json::selection { background: var(--gold); color: #2a1d05; }
  .ruler { position: absolute; left: 0; top: 0; visibility: hidden; padding: 0; }
  .backdrop { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: transparent; padding-bottom: 44px; }
  .backdrop mark { background: rgba(242, 193, 78, .22); color: transparent; border-radius: 2px; }
  .backdrop mark.cur { background: rgba(242, 193, 78, .5); box-shadow: 0 0 0 2px var(--gold); }

  .cmpintro { color: var(--muted); font-size: .92rem; margin: 0 0 14px; }
  .cmpgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 14px; }
  .pick { padding: 14px 16px 16px; }
  .pick h2 { font: 700 1rem var(--pix); color: var(--gold); margin: 0 0 10px; }
  .pick .name { font-weight: 600; overflow-wrap: anywhere; margin: 10px 0 2px; }
  .pick .meta { color: var(--muted); font-size: .85rem; }
  .pick .meta.bad { color: var(--red); }
  .pick .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .cmpbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .hint { color: var(--gold); font-size: .88rem; }
  .diff { display: flex; flex-direction: column; gap: 12px; }
  details.dsec { background: var(--panel); box-shadow: 0 0 0 2px var(--line-soft); }
  details.dsec > summary { cursor: pointer; padding: 0 14px; min-height: var(--tap); display: flex; align-items: center; gap: 10px; font-family: var(--pix); font-weight: 700; list-style: none; }
  details.dsec > summary::-webkit-details-marker { display: none; }
  details.dsec > summary::before { content: "+"; color: var(--gold); width: 1ch; }
  details.dsec[open] > summary::before { content: "−"; }
  details.dsec > summary .n { margin-left: auto; color: var(--muted); font: 500 .82rem var(--body); }
  .dbody { padding: 4px 14px 12px; font-size: .92rem; }
  .dline { padding: 4px 0; border-bottom: 1px solid var(--line-soft); overflow-wrap: anywhere; }
  .dline:last-child { border-bottom: 0; }
  .d-add { color: var(--green); } .d-del { color: var(--red); } .d-chg { color: var(--gold); }
  .dline .arr { color: var(--muted); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.mt { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.mt th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px 6px 0; }
  table.mt td { padding: 4px 8px 4px 0; border-top: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
  table.mt td:first-child { overflow-wrap: anywhere; min-width: 160px; }
  table.mt td.num, table.mt th.num { text-align: right; white-space: nowrap; }
  .mfilter { margin-bottom: 10px; }
  .none { color: var(--muted); padding: 16px 0; }

  .bar {
    position: sticky; bottom: 0; z-index: 5;
    background: var(--bg); border-top: 2px solid var(--line-soft);
    padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .bar-in { max-width: 1008px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .state { margin-right: auto; font-size: .92rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .state.dirty { color: var(--gold); }
  .state.bad { color: var(--red); }
  .state.ok { color: var(--green); }

  footer { color: var(--muted); font-size: .76rem; text-align: center; padding: 0 20px 16px; }
  footer a { color: inherit; }

  @media (max-width: 760px) {
    .grid, .cmpgrid, .pu { grid-template-columns: minmax(0, 1fr); }
    .col, .grid { gap: 18px; }
    .sec { padding: 14px; }
    input, select, textarea.json { font-size: 16px; }
    textarea.json { font-size: 13px; height: 56dvh; }
    .bar-in .btn { min-width: 0; }
    #checksumBtn { flex: 1.6 1 0; }
    .coinnum { font-size: 1.6rem; flex: 1 1 8ch; width: auto; }
    .bar-in .state { flex: 1 1 100%; }
    .bar-in .btn { flex: 1 1 0; font-size: .85rem; padding: 0 8px; }
    .jsonbar .search { flex: 1 1 100%; }
    .jsonbar .btn { flex: 1 1 0; }
    #pickBtn { font-size: .85rem; padding: 0 12px; }
    .drow { grid-template-columns: minmax(0, 1fr) 60px 76px; gap: 6px; }
    .brand h1 { font-size: 1.05rem; }
  }
  @media (max-width: 420px) {
    .brand small { display: none; }
    .roster { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
    main { padding-top: 14px; }
  }
</style>

<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span id="brandIcon"></span>
      <div>
        <h1>Savegame</h1>
        <small>Vampire Crawlers</small>
      </div>
    </div>
    <label class="btn" id="pickBtn" tabindex="0">
      Seleccionar archivo
      <input type="file" id="fileInput">
    </label>
  </div>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabSum" aria-selected="true">Resumen</button>
    <button class="tab" role="tab" id="tabJson" aria-selected="false">JSON completo</button>
    <button class="tab" role="tab" id="tabCmp" aria-selected="false">Comparar</button>
  </div>

  <section class="frame empty" id="empty">
    <div id="emptyIcon"></div>
    <p>Elige tu archivo de guardado para ver qué contiene.</p>
    <div class="path">Windows (Steam): %USERPROFILE%\AppData\LocalLow\Nosebleed Interactive\Vampire Crawlers\Save\SaveProfile0.save</div>
  </section>

  <div class="fileline" id="fileline" hidden>
    <b id="fileName"></b>
    <span id="fileMeta"></span>
  </div>

  <div id="viewSum" hidden></div>

  <div id="viewJson" hidden>
    <div class="jsonbar">
      <input class="search" id="q" type="search" placeholder="Buscar en el JSON" autocomplete="off" spellcheck="false">
      <button class="btn ghost small" id="qPrev" type="button">Anterior</button>
      <button class="btn ghost small" id="qNext" type="button">Siguiente</button>

  <div id="viewCmp" hidden></div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <span class="state" id="state"></span>
    <button class="btn ghost" id="resetBtn" type="button" disabled>Restablecer</button>
    <button class="btn ghost" id="backupBtn" type="button">Copia del original</button>
    <button class="btn" id="checksumBtn" type="button" disabled>Hacer checksum</button>
  </div>
</div>

<script>
(() => {
class RawNum {
  constructor(raw) { this.raw = raw; }
  valueOf() { return Number(this.raw); }
  toString() { return this.raw; }
}

function parseJSON(text) {
  let i = 0;
  const n = text.length;
  const NUM = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
  function fail(msg) {
    let line = 1, col = 1;
    for (let k = 0; k < i && k < n; k++) { if (text[k] === "\n") { line++; col = 1; } else col++; }
    throw new SyntaxError(msg + " (línea " + line + ", columna " + col + ")");
  }
  function ws() {
    while (i < n) {
      const c = text.charCodeAt(i);
      if (c === 32 || c === 10 || c === 13 || c === 9) i++; else break;
    }
  }
  function str() {
    const start = i++;
    while (i < n) {
      const c = text[i];
      if (c === "\\") i += 2;
      else if (c === '"') { i++; return JSON.parse(text.slice(start, i)); }
      else i++;
    }
    fail("Texto sin cerrar");
  }
  function value() {
    ws();
    const c = text[i];
    if (c === "{") {
      i++;
      const o = Object.create(null);
      ws();
      if (text[i] === "}") { i++; return o; }
      for (;;) {
        ws();
        if (text[i] !== '"') fail("Se esperaba un nombre entre comillas");
        const k = str();
        ws();
        if (text[i] !== ":") fail("Falta «:»");
        i++;
        o[k] = value();
        ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "}") { i++; return o; }
        fail("Se esperaba «,» o «}»");
      }
    }
    if (c === "[") {
      i++;
      const a = [];
      ws();
      if (text[i] === "]") { i++; return a; }
      for (;;) {
        a.push(value());
        ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "]") { i++; return a; }
        fail("Se esperaba «,» o «]»");
      }
    }
    if (c === '"') return str();
    if (c === "-" || (c >= "0" && c <= "9")) {
      NUM.lastIndex = i;
      const m = NUM.exec(text);
      if (!m) fail("Número no válido");
      i += m[0].length;
      const raw = m[0];
      if (/[.eE]/.test(raw) || !Number.isSafeInteger(Number(raw))) return new RawNum(raw);
      return Number(raw);
    }
    if (text.startsWith("true", i)) { i += 4; return true; }
    if (text.startsWith("false", i)) { i += 5; return false; }
    if (text.startsWith("null", i)) { i += 4; return null; }
    fail(i >= n ? "El texto termina antes de tiempo" : "Carácter inesperado");
  }
  const v = value();
  ws();
  if (i < n) fail("Hay texto de más al final");
  return v;
}

function ser(v, ind) {
  ind = ind || "";
  if (v === null) return "null";
  switch (typeof v) {
    case "boolean": return v ? "true" : "false";
    case "number": return Number.isFinite(v) ? String(v) : "null";
    case "string": return JSON.stringify(v);
  }
  if (v instanceof RawNum) return v.raw;
  const inner = ind + "  ";
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[\n" + v.map((x) => inner + ser(x, inner)).join(",\n") + "\n" + ind + "]";
  }
  const ks = Object.keys(v);
  if (!ks.length) return "{}";
  return "{\n" + ks.map((k) => inner + JSON.stringify(k) + ": " + ser(v[k], inner)).join(",\n") + "\n" + ind + "}";
}

function sha1(bytes) {
  const l = bytes.length;
  const total = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes);
  buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(l / 0x20000000));
  dv.setUint32(total - 4, (l << 3) >>> 0);
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Uint32Array(80);
  for (let o = 0; o < total; o += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(o + t * 4);

    matches = []; mi = -1;
    if (needle) {
      const hay = editor.value.toLowerCase();
      let i = hay.indexOf(needle);
      while (i !== -1 && matches.length < 20000) { matches.push(i); i = hay.indexOf(needle, i + needle.length); }
      if (matches.length) mi = 0;
    }
    showMatch();
  }
  function showMatch() {
    paint();
    if (!q.value) { qCount.textContent = ""; return; }
    if (mi < 0) { qCount.textContent = "Sin resultados"; return; }
    const pos = matches[mi];
    const line = editor.value.slice(0, pos).split("\n").length;
    qCount.textContent = (mi + 1) + " de " + matches.length + " · línea " + line;
    editor.scrollTop = Math.max(0, (line - 1) * LINE_H - editor.clientHeight / 3);
    // Desplazamiento horizontal: si la coincidencia queda fuera de la pantalla, se acerca.
    const col = pos - (editor.value.lastIndexOf("\n", pos - 1) + 1);
    const x = 12 + col * charW();
    editor.scrollLeft = x > editor.clientWidth - 120 ? Math.max(0, x - editor.clientWidth / 4) : 0;
    backdrop.scrollTop = editor.scrollTop; backdrop.scrollLeft = editor.scrollLeft;
  }
  function step(dir) { if (matches.length) { mi = (mi + dir + matches.length) % matches.length; showMatch(); } }
  q.addEventListener("input", runSearch);
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); step(e.shiftKey ? -1 : 1); } });
  $("qNext").addEventListener("click", () => step(1));
  $("qPrev").addEventListener("click", () => step(-1));

  function buildChips() {
    const box = $("chips");
    box.replaceChildren();
    const D = state && state.Data;
    if (!D || typeof D !== "object") return;
    box.append(h("span", {}, "Ir a:"));
    Object.keys(D).filter((k) => D[k] && typeof D[k] === "object").forEach((k) => {
      box.append(h("button", { class: "chip", type: "button", onclick: () => { q.value = '"' + k + '"'; runSearch(); } }, k.replace(/SaveData$/, "")));
    });
  }

  editor.addEventListener("input", () => {
    try { state = parseJSON(editor.value); badJson = null; }
    catch (e) { badJson = e.message; }
    updateBar();
    if (q.value) runSearch();
  });

  /* ---------- cargar archivo ---------- */
  $("pickBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("fileInput").click(); } });

  $("fileInput").addEventListener("change", async () => {
    const file = $("fileInput").files && $("fileInput").files[0];
    $("fileInput").value = "";
    if (!file) return;
    await loadMain(file);
  });

  async function loadMain(file) {
    let text, root;
    try { text = await readText(file); root = parseJSON(text); }
    catch (e) { alert("No pude leer este archivo como un guardado (JSON válido).\n\n" + e.message); return false; }
    if (!root || typeof root !== "object" || Array.isArray(root)) { alert("El archivo no tiene el formato de un guardado."); return false; }
    originalName = file.name; originalRaw = text; state = root;
    eol = text.includes("\r\n") ? "\r\n" : "\n";
    baseline = ser(state); origSer = baseline; badJson = null; q.value = "";
    csKind = checksumKind(state);
    $("fileName").textContent = file.name;
    fileKB = (file.size / 1024).toFixed(1);
    setMeta();
    const lead = state.Data && state.Data.RunMetaSaveData && state.Data.RunMetaSaveData.SelectedPartyFccIds;
    if (lead && lead[0]) $("brandIcon").replaceChildren(charSprite(lead[0], 32));
    tab = "sum";
    setTab("sum");
    return true;
  }

  /* ---------- descargas ---------- */
  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    const a = h("a", { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  checksumBtn.addEventListener("click", () => {
    if (badJson || !state) return;
    // Si el checksum del original no coincidía con el algoritmo conocido, se deja vacío (el juego lo acepta).
    const real = csKind !== "mismatch" && state.Data && typeof state.Data === "object";
    state.Checksum = real ? checksumOf(state.Data) : "";
    download(originalName, ser(state).replace(/\n/g, eol));
    baseline = ser(state);
    csKind = real ? "valid" : "empty";
    if (tab === "json") editor.value = baseline; else renderSummary();
    setMeta();
    updateBar(real ? "Checksum calculado · archivo descargado" : "Checksum vacío (el original no coincidía) · archivo descargado");
  });

  resetBtn.addEventListener("click", () => {
    if (!originalRaw || !confirm("¿Volver a los valores del archivo que subiste? Se perderán los cambios que hayas hecho.")) return;
    try { state = parseJSON(originalRaw); } catch (e) { return; }
    baseline = ser(state); origSer = baseline; badJson = null;
    csKind = checksumKind(state);
    setMeta();
    if (tab === "json") { editor.value = baseline; runSearch(); } else renderSummary();
    updateBar("Restablecido al archivo original");
  });

  $("backupBtn").addEventListener("click", () => {
    const dot = originalName.lastIndexOf(".");
    const base = dot > 0 ? originalName.slice(0, dot) : originalName;
    const ext = dot > 0 ? originalName.slice(dot) : "";
    download(base + "_Backup_" + Date.now() + ext, originalRaw);
  });

  /* ---------- comparar ---------- */
  const cmp = { A: null, B: null, err: { A: "", B: "" } };
  let metricFilter = "";

  async function loadCmp(slot, file) {
    try {
      const text = await readText(file);
      const root = parseJSON(text);
      if (!root || !root.Data) throw new Error("No parece un guardado del juego.");
      cmp[slot] = { name: file.name, size: file.size, root }; cmp.err[slot] = "";
    } catch (e) { cmp[slot] = null; cmp.err[slot] = e.message; }
    renderCompare();
  }

  const num = (v) => (v instanceof RawNum ? v.valueOf() : v);
  const same = (a, b) => (a === undefined || b === undefined ? a === b : ser(a) === ser(b));
  function fmtVal(k, v) {
    if (k === "PlayTime") return fmtTime(v);
    if (k === "SaveTimeStamp") return fmtDate(v);
    if (k === "CurrentState") return stateTxt(v);
    if (k === "SelectedDungeonID") return dungeonName(v);
    return v instanceof RawNum ? v.raw : String(v);
  }
  const lab = (k) => LABELS[k] || k;

  function diffRoots(A, B) {
    const secs = [], seen = new Set();
    const general = { title: "Datos generales", rows: [] };
    const pushGen = (k, a, b) => {
      const sig = k + "|" + ser(a) + "|" + ser(b);
      if (seen.has(sig)) return; seen.add(sig);
      let extra = "";
      if (typeof num(a) === "number" && typeof num(b) === "number") { const d = num(b) - num(a); extra = " (" + (d > 0 ? "+" : "") + Number(d.toFixed(2)) + ")"; }
      general.rows.push({ kind: "chg", text: lab(k), a: fmtVal(k, a), b: fmtVal(k, b) + extra });
    };
    const objs = (da, db) => {
      for (const k of new Set([...Object.keys(da || {}), ...Object.keys(db || {})])) {
        const va = da && da[k], vb = db && db[k];
        if (Array.isArray(va) || Array.isArray(vb)) {
          const ra = va || [], rb = vb || [];
          if (isKV(ra) || isKV(rb)) {
            const ma = new Map(ra.map((e) => [e.Key, e.Value])), mb = new Map(rb.map((e) => [e.Key, e.Value]));
            const rows = [];
            for (const [key, v] of mb) {
              if (!ma.has(key)) rows.push({ kind: "add", text: nice(key) + (v === true ? "" : " = " + ser(v).replace(/\s+/g, " ")) });
              else if (!same(ma.get(key), v)) rows.push({ kind: "chg", text: nice(key), a: ser(ma.get(key)).replace(/\s+/g, " "), b: ser(v).replace(/\s+/g, " ") });
            }
            for (const key of ma.keys()) if (!mb.has(key)) rows.push({ kind: "del", text: nice(key) });
            if (rows.length) secs.push({ title: lab(k), rows });
          } else if ([...ra, ...rb].every((x) => typeof x === "string")) {
            const sa = new Set(ra), sb = new Set(rb), rows = [];
            for (const x of sb) if (!sa.has(x)) rows.push({ kind: "add", text: nice(x) });
            for (const x of sa) if (!sb.has(x)) rows.push({ kind: "del", text: nice(x) });
            if (!rows.length && ra.join() !== rb.join()) rows.push({ kind: "chg", text: "Orden", a: ra.map(nice).join(", "), b: rb.map(nice).join(", ") });
            if (rows.length) secs.push({ title: lab(k), rows });
          } else if (k === "SaveObjects" && ra.length !== rb.length) {
            general.rows.push({ kind: "chg", text: "Objetos de partida en curso", a: String(ra.length), b: String(rb.length) });
          }
        } else if (va !== null && typeof va === "object") {
          /* objetos anidados: se tratan aparte */
        } else if (!same(va, vb) && (va === undefined || vb === undefined || typeof va !== "object")) {
          if (va === undefined) general.rows.push({ kind: "add", text: lab(k) + " = " + fmtVal(k, vb) });
          else if (vb === undefined) general.rows.push({ kind: "del", text: lab(k) });
          else pushGen(k, va, vb);
        }
      }
    };
    const a = A.Data, b = B.Data;
    objs(a, b);
    for (const s of ["ProfileSaveData", "RunMetaSaveData", "ProgressionSaveData"]) objs(a[s], b[s]);
    objs(a.GameSaveData, b.GameSaveData);
    secs.unshift(general);

    const metrics = [];
    const ca = (a.MetricsSaveData && a.MetricsSaveData.collectionData) || [], cb = (b.MetricsSaveData && b.MetricsSaveData.collectionData) || [];
    const ids = new Set([...ca.map((c) => c.collectionID), ...cb.map((c) => c.collectionID)]);
    for (const id of [...ids].sort((x, y) => x - y)) {
      const A1 = ca.find((c) => c.collectionID === id), B1 = cb.find((c) => c.collectionID === id);
      const rows = [];
      for (const t of ["doubleMetrics", "longMetrics"]) {
        const ma = new Map(((A1 && A1.dictionarySaveData && A1.dictionarySaveData[t]) || []).map((e) => [e.ID, num(e.Value)]));
        const mb = new Map(((B1 && B1.dictionarySaveData && B1.dictionarySaveData[t]) || []).map((e) => [e.ID, num(e.Value)]));
        for (const key of new Set([...ma.keys(), ...mb.keys()])) {
          const x = ma.get(key), y = mb.get(key);
          if (x !== y) rows.push({ id: key, a: x, b: y, d: (y ?? 0) - (x ?? 0) });
        }
      }
      rows.sort((p, r) => Math.abs(r.d) - Math.abs(p.d));
      if (rows.length) metrics.push({ id, rows });
    }
    return { secs: secs.filter((s) => s.rows.length), metrics };
  }

  const fmtNum = (v) => (v === undefined ? "—" : (Number.isInteger(v) ? v.toLocaleString("es") : v.toLocaleString("es", { maximumFractionDigits: 2 })));

  function metricTable(m) {
    const f = metricFilter.toLowerCase();
    const rows = m.rows.filter((r) => !f || r.id.toLowerCase().includes(f));
    const shown = rows.slice(0, 150);
    const tb = h("tbody", {}, shown.map((r) => h("tr", {},
      h("td", {}, r.id), h("td", { class: "num" }, fmtNum(r.a)), h("td", { class: "num" }, fmtNum(r.b)),
      h("td", { class: "num " + (r.d > 0 ? "d-add" : "d-del") }, (r.d > 0 ? "+" : "") + fmtNum(r.d)))));
    return h("div", {},
      h("div", { class: "scroll" }, h("table", { class: "mt" },
        h("thead", {}, h("tr", {}, h("th", {}, "Métrica"), h("th", { class: "num" }, "A"), h("th", { class: "num" }, "B"), h("th", { class: "num" }, "Cambio"))), tb)),
      rows.length > shown.length ? h("p", { class: "coinnote" }, "Mostrando " + shown.length + " de " + rows.length + ". Usa el filtro para ver el resto.") : null,
      !rows.length ? h("p", { class: "none" }, "Nada coincide con el filtro.") : null);
  }

  function pickPanel(slot, title) {
    const data = cmp[slot];
    const input = h("input", { type: "file", "aria-label": "Archivo " + slot });
    input.addEventListener("change", () => { const f = input.files && input.files[0]; if (f) loadCmp(slot, f); });
    const P = data && data.root.Data && data.root.Data.ProfileSaveData;
    const meta = data
      ? [P && P.SaveTimeStamp ? fmtDate(P.SaveTimeStamp) : null, data.root.Data.saveSystemVersion ? "v" + data.root.Data.saveSystemVersion : null,
        P && P.PlayTime ? fmtTime(P.PlayTime) : null, P && P.TotalCoins !== undefined ? P.TotalCoins + " monedas" : null].filter(Boolean).join(" · ")
      : "";
    return h("div", { class: "frame pick" }, h("h2", {}, title),
      h("div", { class: "acts" },
        h("label", { class: "btn small" }, data ? "Cambiar archivo" : "Elegir archivo", input),
        state ? h("button", { class: "btn ghost small", type: "button", onclick: () => { cmp[slot] = { name: originalName, size: originalRaw.length, root: parseJSON(ser(state)) }; cmp.err[slot] = ""; renderCompare(); } }, "Usar el cargado") : null),
      data ? h("div", { class: "name" }, data.name) : null,
      data ? h("div", { class: "meta" }, meta) : null,
      cmp.err[slot] ? h("div", { class: "meta bad" }, cmp.err[slot]) : null);
  }

  function renderCompare() {
    const root = $("viewCmp");
    root.replaceChildren();
    root.append(h("p", { class: "cmpintro" }, "Elige dos guardados y verás qué cambió de uno a otro. Los archivos no se suben a ningún sitio."));
    root.append(h("div", { class: "cmpgrid" }, pickPanel("A", "A · antes"), pickPanel("B", "B · después")));
    if (!(cmp.A && cmp.B)) return;

    const ta = cmp.A.root.Data.ProfileSaveData && cmp.A.root.Data.ProfileSaveData.SaveTimeStamp;
    const tb = cmp.B.root.Data.ProfileSaveData && cmp.B.root.Data.ProfileSaveData.SaveTimeStamp;
    const bar = h("div", { class: "cmpbar" },
      h("button", { class: "btn ghost small", type: "button", onclick: () => { [cmp.A, cmp.B] = [cmp.B, cmp.A]; renderCompare(); } }, "Intercambiar A y B"));
    if (ta && tb && new Date(ta) > new Date(tb)) bar.append(h("span", { class: "hint" }, "Ojo: A es más reciente que B según su fecha interna."));
    root.append(bar);

    let result;
    try { result = diffRoots(cmp.A.root, cmp.B.root); }
    catch (e) { root.append(h("p", { class: "none" }, "No pude comparar estos archivos: " + e.message)); return; }
    const total = result.secs.reduce((n, s) => n + s.rows.length, 0) + result.metrics.reduce((n, m) => n + m.rows.length, 0);
    if (!total) { root.append(h("p", { class: "none" }, "No hay diferencias entre los dos archivos.")); return; }

    const diff = h("div", { class: "diff" });
    for (const s of result.secs) {
      diff.append(h("details", { class: "dsec", open: s.rows.length <= 14 }, h("summary", {}, s.title, h("span", { class: "n" }, s.rows.length + (s.rows.length === 1 ? " cambio" : " cambios"))),
        h("div", { class: "dbody" }, s.rows.map((r) => h("div", { class: "dline d-" + r.kind },
          r.kind === "add" ? "+ " + r.text : r.kind === "del" ? "− " + r.text : [r.text + ": ", h("span", { class: "arr" }, r.a + " → "), r.b])))));
    }
    if (result.metrics.length) {
      const filter = h("input", { class: "search mfilter", type: "search", placeholder: "Filtrar métricas (por ejemplo: Ender, Gold, Card_A)", spellcheck: "false", value: metricFilter });
      const holders = [];
      filter.addEventListener("input", () => { metricFilter = filter.value; holders.forEach(([m, el]) => el.replaceChildren(metricTable(m))); });
      diff.append(h("div", {}, filter));
      for (const m of result.metrics) {
        const el = h("div", { class: "dbody" }, metricTable(m));
        holders.push([m, el]);
        diff.append(h("details", { class: "dsec" }, h("summary", {}, "Métricas · colección " + m.id, h("span", { class: "n" }, m.rows.length + " cambian")), el));
      }
    }
    root.append(diff);
  }

})();
</script>
</body>
</html>
